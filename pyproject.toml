[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"


[tool.setuptools_scm]
version_scheme = "post-release"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_agents"]

[project]
name = "panel-agents"
dynamic = ["version"]
description = 'Panel components for building agent user interfaces.'
readme = "README.md"
license = { text = "BSD" }
requires-python = ">=3.12"
authors = [{ name = "Philipp Rudiger", email = "philipp@holoviz.org" }]
maintainers = [
    { name = "Philipp Rudiger", email = "philipp@holoviz.org" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # panel-material-ui 0.17 needs Panel 1.11, as 1.10 pins it below 0.17.
    "pandas",
    "panel >=1.11.0rc0",
    "panel-material-ui >=0.17.0rc1",
    "pydantic >=2.12",
]

[project.urls]
Homepage = "https://github.com/panel-extensions/panel-agents"
Documentation = "https://panel-extensions.github.io/panel-agents"
Source = "https://github.com/panel-extensions/panel-agents"

[project.optional-dependencies]
pydantic-ai = [
    "pydantic-ai-slim >=2.60",
]
mcp = [
    "fastmcp-slim[server] >=4.1,<5",
    "pydantic-ai-slim >=2.40",
]
examples = [
    "duckdb",
    "pandas",
    "pydantic-ai-slim[openai,anthropic] >=2.60",
]
dev = [
    "mkdocs-material",
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs_pycafe",
    "pre-commit",
    "pytest-asyncio",
    "pytest-rerunfailures",
    "pytest-xdist",
    "pytest",
    "watchfiles",
]
mypy = [
    "mypy",
    "types-requests",
    "typing-extensions",
]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    ".tox",
    ".eggs",
    "*.egg",
    "doc",
    "dist",
    "build",
    "_build",
    "examples",
    ".ipynb_checkpoints",
    "node_modules",
    "hatch_build.py",
]
line-length = 165
fix = true

[tool.ruff.lint]
ignore = [
    "E402",  # Module level import not at top of file
    "E712",  # Avoid equality comparisons to True
    "E731",  # Do not assign a lambda expression, use a def
    "N803",  # Argument name should be lowercase
    "N806",  # Variable name should be lowercase
]
select = [
    "B",    # flake8-bugbear
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "PIE",
    "T20",
    "RUF006",
    "UP004",
    "UP006",
    "UP020",
    "UP028",
    "UP030",
    "UP031",
    "UP032",
    "UP034",
    "UP036",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = ["D"]
# Ignore all files that end in `_test.py`.
"*_test.py" = ["D"]

[tool.isort]
force_grid_wrap = 4
multi_line_output = 5
combine_as_imports = true
lines_between_types = 1
include_trailing_comma = true

[tool.pytest.ini_options]
addopts = "--pyargs --doctest-ignore-import-errors --color=yes"
norecursedirs = "doc .git dist build _build .ipynb_checkpoints examples"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
minversion = "7"
log_cli_level = "INFO"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
testpaths = ["tests"]

[tool.mypy]
python_version = '3.12'
no_implicit_optional = true
check_untyped_defs = true

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }
